 d="M386 28H496Q538 28 538 67Q538 91 519 103Q542 115 542 151Q542 192 496 192H386Z
    M428 66V91H486Q498 91 498 78Q498 66 486 66Z
    M428 123V154H490Q502 154 502 138Q502 123 490 123Z"/>

<!-- E -->
<path fill="url(#silver)" d="M574 28H782V66H616V91H758V128H616V154H782V192H574Z"/>

<!-- The 3 sits in the negative-space cutout -->
<use href="#three" fill="url(#gold)"/>
</svg>