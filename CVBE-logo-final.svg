<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220">
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".5" stop-color="#f3f1ed"/>
    <stop offset="1" stop-color="#d0cfcb"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffc36f"/>
    <stop offset="1" stop-color="#dc9340"/>
  </linearGradient>

  <!-- The exact 3 silhouette used both for the visible 3 and the V/B cutout.
       The cutout uses a tiny clearance around it. -->
  <path id="three"
    d="M347 6
       Q347 0 354 0 H386
       Q398 0 398 11
       Q398 20 390 24
       Q399 28 399 39
       Q399 52 387 52 H354
       Q347 52 347 45
       H359
       Q359 40 365 40 H381
       Q386 40 386 35
       Q386 30 381 30 H362 V20 H381
       Q386 20 386 15
       Q386 10 381 10 H365
       Q359 10 359 15 H347 Z"/>

  <mask id="logoMask" maskUnits="userSpaceOnUse" x="0" y="0" width="820" height="220">
    <rect width="820" height="220" fill="white"/>
    <!-- slightly enlarged 3 silhouette becomes negative space in V/B -->
    <use href="#three" fill="black" transform="translate(-4,-4) scale(1.02)"/>
  </mask>
</defs>

<!-- C -->
